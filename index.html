<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Signage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% + 60px); /* extends 60px below viewport, hiding Google's toolbar */
      border: none;
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
    }

    #error h1 { font-size: 1.5rem; color: #f55; }
    #error p  { font-size: 1rem; color: #ccc; max-width: 480px; line-height: 1.6; }
    #error code { background: #333; padding: 0.2em 0.5em; border-radius: 4px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <iframe id="slides" allowfullscreen></iframe>

  <div id="error">
    <h1>Missing Presentation ID</h1>
    <p>Add <code>?id=YOUR_PRESENTATION_ID</code> to the URL.</p>
    <p>
      Example:<br>
      <code>https://yourname.github.io/digital-signage/?id=1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms&amp;delay=8000</code>
    </p>
    <p>Find the presentation ID in the Google Slides URL between <code>/d/</code> and <code>/edit</code>.</p>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const id      = params.get('id');
    const delay   = parseInt(params.get('delay'), 10) || 10000;

    if (!id) {
      document.getElementById('slides').style.display = 'none';
      document.getElementById('error').style.display  = 'flex';
    } else {
      const src = `https://docs.google.com/presentation/d/${id}/embed?start=true&loop=true&delayms=${delay}`;
      document.getElementById('slides').src = src;
    }

    function goFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
      if (req) req.call(el).catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', goFullscreen);
    document.addEventListener('click', goFullscreen);

    document.addEventListener('contextmenu', e => e.preventDefault());

    // Keep screen awake ---------------------------------------------------

    // 1) Wake Lock API (works in Firefox for Fire TV and modern browsers)
    let wakeLock = null;
    async function acquireWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {}
      }
    }
    acquireWakeLock();
    // Re-acquire if the tab becomes visible again after being hidden
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') acquireWakeLock();
    });

    // 2) Silent looping video fallback (keeps screen on in Silk browser)
    //    A 1×1 transparent MP4 — no visible effect, just signals activity.
    const v = document.createElement('video');
    v.loop = v.muted = v.playsInline = true;
    v.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';

    document.body.appendChild(v);
    v.play().catch(() => {});

    // Silently refresh the iframe every hour so slide edits appear.
    // Fades out, reloads, then fades back in — no jarring black flash.
    function reloadSlides() {
      const iframe = document.getElementById('slides');
      iframe.style.transition = 'opacity 1.5s';
      iframe.style.opacity = '0';
      setTimeout(() => {
        iframe.onload = () => {
          iframe.style.opacity = '1';
          iframe.onload = null;
        };
        iframe.src = iframe.src;
      }, 1500);
    }

    if (id) setInterval(reloadSlides, 3600000);

    // Auto-recover if WiFi drops — reload slides as soon as connection returns
    window.addEventListener('online', () => {
      const iframe = document.getElementById('slides');
      if (id && iframe.src) reloadSlides();
    });
  </script>
</body>
</html>
